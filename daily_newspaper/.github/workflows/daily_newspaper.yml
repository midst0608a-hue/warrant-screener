name: Generate Daily Newspaper

on:
  schedule:
    # 每天台灣時間早上 06:30 (UTC 22:30) 定時執行
    - cron: '30 22 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

# 設定 GitHub Pages 發布權限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd daily_newspaper
          pip install -r requirements.txt

      - name: Generate Daily Newspaper Edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public
          cd daily_newspaper
          python main.py --output ../public/index.html --no-open --save-json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
